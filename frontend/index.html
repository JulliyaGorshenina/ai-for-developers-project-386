<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Запись на звонок</title>
  </head>
  <body>
    <header class="topbar">
      <h1>Запись на звонок</h1>
      <a href="/admin.html">Для владельца</a>
    </header>

    <main>
      <p class="hint">Выберите удобное время — слоты по 30 минут.</p>
      <p id="status" class="status"></p>
      <div id="days" class="days"></div>
    </main>

    <dialog id="booking-dialog" class="dialog">
      <form id="booking-form">
        <h2 id="dialog-title">Новая запись</h2>
        <label>Имя<input name="name" required maxlength="200" /></label>
        <label>Email<input name="email" type="email" required maxlength="200" /></label>
        <label>Комментарий<textarea name="comment" maxlength="1000" rows="3"></textarea></label>
        <p id="dialog-error" class="error"></p>
        <div class="dialog-actions">
          <button type="button" id="cancel-btn" class="secondary">Отмена</button>
          <button type="submit">Записаться</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
