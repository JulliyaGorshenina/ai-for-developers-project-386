<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кабинет владельца</title>
  </head>
  <body>
    <header class="topbar">
      <h1>Кабинет владельца</h1>
      <nav>
        <a href="/">На главную</a>
        <a href="/booking.html">К странице записи</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2>Типы встреч</h2>
        <div id="event-types"></div>
        <form id="event-type-form" class="row">
          <input name="id" placeholder="идентификатор (slug)" required maxlength="64" />
          <input name="name" placeholder="Название" required maxlength="200" />
          <input name="description" placeholder="Описание" maxlength="1000" />
          <input
            name="duration_minutes"
            type="number"
            min="1"
            max="600"
            value="30"
            required
            aria-label="Длительность, минут"
          />
          <button type="submit">Добавить тип</button>
        </form>
        <p id="types-status" class="status"></p>
      </section>

      <section class="card">
        <h2>Недельное расписание</h2>
        <div id="schedule-rows"></div>
        <div class="row">
          <button id="add-window" class="secondary">Добавить окно</button>
          <button id="save-schedule">Сохранить расписание</button>
        </div>
        <p id="schedule-status" class="status"></p>
      </section>

      <section class="card">
        <h2>Предстоящие встречи</h2>
        <div id="bookings"></div>
        <p id="bookings-status" class="status"></p>
      </section>
    </main>

    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
