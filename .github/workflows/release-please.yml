# Creates/updates a release PR on every push to main, based on Conventional
# Commits. Requires the repository setting "Allow GitHub Actions to create and
# approve pull requests" (Settings > Actions > General > Workflow permissions).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
